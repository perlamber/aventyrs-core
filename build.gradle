plugins {
    id 'java-library'
    id 'jacoco'
    id 'maven-publish'
}

group 'org.aventyrs.core'
version '0.0.18'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.8.1'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'
    // https://mvnrepository.com/artifact/org.mockito/mockito-android
    testImplementation group: 'org.mockito', name: 'mockito-android', version: '3.4.0'
    testImplementation 'junit:junit:4.12'
    testImplementation 'org.mockito:mockito-core:2.4.0'
    testImplementation 'org.powermock:powermock-core:1.7.0RC2'
    testImplementation 'org.powermock:powermock-module-junit4:1.7.0RC2'
    testImplementation 'org.powermock:powermock-api-mockito2:1.7.0RC2'
    // https://mvnrepository.com/artifact/br.com.six2six/fixture-factory
    testImplementation group: 'br.com.six2six', name: 'fixture-factory', version: '3.1.0'
    testImplementation('com.thoughtworks.paranamer:paranamer'){
        version {
            strictly '2.8'
        }
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                minimum = 0.85
            }
        }
    }
}

tasks.register('countClasses') {
    doLast {
        def classCount = 0
        tasks.withType(JavaCompile).each { compileTask ->
            def tree = fileTree(compileTask.destinationDirectory)
            tree.include '**/*.class'
            classCount += tree.files.size()
        }
        println "Total compiled classes: ${classCount}"
    }
}

check.dependsOn jacocoTestCoverageVerification

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = 'aventyrs-core'
            version = project.version
        }
    }
    repositories {
        mavenLocal()
    }
}