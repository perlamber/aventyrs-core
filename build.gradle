plugins {
    id 'java'
}

group 'org.aventyrs.core'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.projectlombok:lombok:1.18.22'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    implementation fileTree(dir: "libs", include: ["*.jar"])
    compileOnly 'org.projectlombok:lombok:1.18.12'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'
    // https://mvnrepository.com/artifact/org.reflections/reflections
    implementation group: 'org.reflections', name: 'reflections', version: '0.9.11'
    // https://mvnrepository.com/artifact/org.mockito/mockito-android
    testImplementation group: 'org.mockito', name: 'mockito-android', version: '3.4.0'
    testImplementation 'junit:junit:4.12'
    testImplementation 'org.mockito:mockito-core:2.4.0'
    testImplementation 'org.powermock:powermock-core:1.7.0RC2'
    testImplementation 'org.powermock:powermock-module-junit4:1.7.0RC2'
    testImplementation 'org.powermock:powermock-api-mockito2:1.7.0RC2'
    // https://mvnrepository.com/artifact/br.com.six2six/fixture-factory
    testImplementation group: 'br.com.six2six', name: 'fixture-factory', version: '3.1.0'
    testImplementation('com.thoughtworks.paranamer:paranamer'){
        version {
            strictly '2.8'
        }
    }
}

test {
    useJUnitPlatform()
}