plugins {
    id 'java-library'
    id 'jacoco'
    id 'maven-publish'
}

group = 'org.aventyrs.core'
version = '0.0.23'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
}

jacoco {
    toolVersion = '0.8.13'
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'

    testImplementation platform('org.junit:junit-bom:5.12.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // https://mvnrepository.com/artifact/br.com.six2six/fixture-factory
    testImplementation 'br.com.six2six:fixture-factory:3.1.0'
    testImplementation('com.thoughtworks.paranamer:paranamer') {
        version {
            strictly '2.8'
        }
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                minimum = 0.85
            }
        }
    }
}

tasks.register('countClasses') {
    def classDirs = tasks.withType(JavaCompile).collect { it.destinationDirectory }
    doLast {
        def classCount = classDirs.sum { dir -> fileTree(dir).matching { include '**/*.class' }.files.size() }
        println "Total compiled classes: ${classCount}"
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = 'aventyrs-core'
            version = project.version
        }
    }
    repositories {
        mavenLocal()
    }
}
